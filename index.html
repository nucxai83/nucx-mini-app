<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Решатель</title>
    <!-- Подключаем SDK Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI Решатель</h1>
            <p class="subtitle">Файлы и задачи в одном месте</p>
        </header>

        <!-- Блок 1: Нейросеть -->
        <section class="card">
    <h2>📤 Отправить задачу в нейросеть</h2>
    <label for="modelSelect">Выберите модель:</label>
    <select id="modelSelect" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px;">
        <option value="gemini-3.8-flash">Gemini 3.8 Flash (быстрая)</option>
        <option value="gemini-3.8-pro">Gemini 3.8 Pro (умная)</option>
        <option value="gpt-4o-mini">GPT-4o Mini</option>
        <option value="claude-3-haiku">Claude 3 Haiku</option>
    </select>
    <textarea id="taskInput" rows="4" placeholder="Введите задачу..."></textarea>
    <button class="btn primary" onclick="sendToAI()">Отправить в AI</button>
</section>

        <!-- Блок 2: Файлы -->
        <section class="card">
            <h2>📁 Обмен файлами</h2>
            <button class="btn" onclick="getFiles()">Получить файлы с флешки</button>
            <button class="btn" onclick="uploadToFlash()">Отправить файл на флешку</button>
            <div id="fileList" class="file-list"></div>
        </section>

        <div id="status" class="status">Готов к работе</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
